<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underwriter — EP</title>
  <link rel="icon" type="image/jpeg" href="assets/img/cover.jpg">
  <link rel="apple-touch-icon" href="assets/img/cover.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Underwriter</a>
      <nav class="site-nav">
        <a href="index.html" class="active">Home</a>
        <a href="visuals.html">Visuals</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- Hero -->
    <section class="hero">
      <h1>Underwriter</h1>
      <p class="ep-title">Ashes of the Architects</p>
    </section>

    <!-- Audio Player -->
    <section class="player-section">
      <div class="container">
        <div class="player">
          <div class="player-art" aria-label="Album artwork">
            <img src="assets/img/cover.jpg" alt="Ashes of the Architects cover art" loading="lazy">
          </div>

          <div id="player-track-title" class="player-track-title">Loading&hellip;</div>

          <!-- Seek Bar -->
          <div class="player-seek">
            <div id="seek-bar-wrap" class="seek-bar-wrap">
              <div id="seek-bar-fill" class="seek-bar-fill"></div>
            </div>
          </div>
          <div class="player-times">
            <span id="time-current">0:00</span>
            <span id="time-duration">0:00</span>
          </div>

          <!-- Transport Controls -->
          <div class="player-controls">
            <button id="btn-prev" aria-label="Previous track">&#9198;</button>
            <button id="btn-play" class="btn-play" aria-label="Play">&#9654;</button>
            <button id="btn-next" aria-label="Next track">&#9197;</button>
          </div>

          <!-- Volume -->
          <div class="player-volume">
            <button id="btn-mute" class="btn-mute" aria-label="Mute">&#128266;</button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
          </div>

          <!-- Tracklist -->
          <ul id="tracklist" class="tracklist"></ul>

        </div>
      </div>
    </section>

    <!-- Social Links -->
    <section class="social-section">
      <h2>Connect</h2>
      <div class="social-links">
        <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17.5" cy="6.5" r="1.1" fill="currentColor"/>
          </svg>
          <span>Instagram</span>
        </a>
        <a href="https://youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="2.8" y="6.2" width="18.4" height="11.6" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M10 9.2L15.2 12 10 14.8V9.2z" fill="currentColor"/>
          </svg>
          <span>YouTube</span>
        </a>
        <a href="https://open.spotify.com/" target="_blank" rel="noopener" aria-label="Spotify">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7.3 10.1c3.2-0.9 6.2-0.6 9 0.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7.9 12.8c2.6-0.7 5-0.4 7.3 0.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M8.5 15.3c2.1-0.5 4-0.3 5.8 0.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span>Spotify</span>
        </a>
        <a href="https://bandcamp.com/" target="_blank" rel="noopener" aria-label="Bandcamp">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <polygon points="6.2,6.3 21.2,6.3 17.8,17.7 2.8,17.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span>Bandcamp</span>
        </a>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    &copy; 2026 Underwriter. All rights reserved.
  </footer>

  <script src="js/player.js"></script>
</body>
</html>
