<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underwriter — EP</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Underwriter</a>
      <nav class="site-nav">
        <a href="index.html" class="active">Home</a>
        <a href="visuals.html">Visuals</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- Hero -->
    <section class="hero">
      <h1>Underwriter</h1>
      <p class="ep-title">Ashes of the Architects</p>
    </section>

    <!-- Audio Player -->
    <section class="player-section">
      <div class="container">
        <div class="player">

          <div id="player-track-title" class="player-track-title">Loading&hellip;</div>

          <!-- Seek Bar -->
          <div class="player-seek">
            <div id="seek-bar-wrap" class="seek-bar-wrap">
              <div id="seek-bar-fill" class="seek-bar-fill"></div>
            </div>
          </div>
          <div class="player-times">
            <span id="time-current">0:00</span>
            <span id="time-duration">0:00</span>
          </div>

          <!-- Transport Controls -->
          <div class="player-controls">
            <button id="btn-prev" aria-label="Previous track">&#9198;</button>
            <button id="btn-play" class="btn-play" aria-label="Play">&#9654;</button>
            <button id="btn-next" aria-label="Next track">&#9197;</button>
          </div>

          <!-- Volume -->
          <div class="player-volume">
            <button id="btn-mute" class="btn-mute" aria-label="Mute">&#128266;</button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
          </div>

          <!-- Tracklist -->
          <ul id="tracklist" class="tracklist"></ul>

        </div>
      </div>
    </section>

    <!-- Social Links -->
    <section class="social-section">
      <h2>Connect</h2>
      <div class="social-links">
        <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://youtube.com/" target="_blank" rel="noopener">YouTube</a>
        <a href="https://open.spotify.com/" target="_blank" rel="noopener">Spotify</a>
        <a href="https://bandcamp.com/" target="_blank" rel="noopener">Bandcamp</a>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    &copy; 2026 Underwriter. All rights reserved.
  </footer>

  <script src="js/player.js"></script>
</body>
</html>
